maven_group = net.lunade
archives_base_name = LunaSlimes

# Dependencies
fabric_api_version=0.119.0+1.21.5
frozenlib_version=2.0.3-mc1.21.5
modmenu_version=11.0.2
cloth_config_version=17.0.142

